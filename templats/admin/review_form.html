{% extends 'admin/base_admin.html' %}

{% block title %}{{ title }}{% endblock %}
{% block header %}{{ title }}{% endblock %}

{% block content %}
<div class="admin-card">
    <form method="post" enctype="multipart/form-data" class="admin-form">
        {% csrf_token %}
        

            <div class="form-group">
                <label for="{{ form.name.id_for_label }}">Customer Name</label>
                {{ form.name }}
            </div>
 
        
        <div class="form-group">
            <label for="{{ form.review.id_for_label }}">Description</label>
            {{ form.review }}
        </div>

            <div class="form-group">
                <label for="{{ form.rating.id_for_label }}">rating</label>
                {{ form.rating }}
            </div>

        </div>
               <div class="form-group">
            <label for="{{ form.is_approved.id_for_label }}" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                {{ form.is_approved }}
                Approve this review
            </label>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> {{ button_text }}
            </button>
            <a href="{% url 'admin_review' %}" class="btn btn-danger">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
